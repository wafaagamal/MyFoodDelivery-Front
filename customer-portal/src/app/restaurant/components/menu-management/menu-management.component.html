<div class="menu-page">
  <div class="page-header">
    <h1>Menu Management</h1>
    <button class="btn-add" (click)="showAddModal = true">
      <i class="fas fa-plus"></i> Add Item
    </button>
  </div>
  
  <div class="categories-tabs">
    <button *ngFor="let cat of categories" 
            [class.active]="activeCategory === cat"
            (click)="activeCategory = cat">
      {{ cat }}
    </button>
  </div>
  
  <div class="menu-grid">
    <div class="menu-item" *ngFor="let item of filteredItems">
      <img *ngIf="item.image" [src]="item.image" [alt]="item.name">
      <div *ngIf="!item.image" class="item-image-placeholder"><i class="fas fa-utensils"></i></div>
      <div class="item-content">
        <div class="item-header">
          <h3>{{ item.name }}</h3>
          <label class="toggle">
            <input type="checkbox" [(ngModel)]="item.available">
            <span class="slider"></span>
          </label>
        </div>
        <p class="description">{{ item.description }}</p>
        <div class="item-footer">
          <span class="price">${{ item.price | number:'1.2-2' }}</span>
          <div class="actions">
            <button class="btn-edit" (click)="editItem(item)">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn-delete" (click)="deleteItem(item)">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Item Modal -->
<div class="modal-overlay" *ngIf="showAddModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ editingItem ? 'Edit Menu Item' : 'Add New Menu Item' }}</h2>
      <button class="btn-close" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Item Name *</label>
        <input type="text" [(ngModel)]="newItem.name" placeholder="Enter item name">
      </div>
      <div class="form-group">
        <label>Category *</label>
        <select [(ngModel)]="newItem.categoryId">
          <option value="">Select a category</option>
          <option *ngFor="let cat of categoriesForSelect" [value]="cat.id">{{ cat.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price ($) *</label>
        <input type="number" [(ngModel)]="newItem.price" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="newItem.description" placeholder="Enter item description" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" [(ngModel)]="newItem.imageUrl" placeholder="https://...">
      </div>
      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="newItem.isAvailable">
          <span>Available for ordering</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()">Cancel</button>
      <button class="btn-save" (click)="saveItem()" [disabled]="!isFormValid()">{{ editingItem ? 'Update Item' : 'Add Item' }}</button>
    </div>
  </div>
</div>
